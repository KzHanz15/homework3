<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的家乡 - 家乡风光专题</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="bar-wrap">
      <a class="brand" href="#">山水人间 · 我的家乡</a>
      <nav class="main-nav">
        <a href="#hero">首页</a>
        <a href="#gallery">风光图廊</a>
        <a href="#feature">特色</a>
        <a href="#about">关于家乡</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="hero">
    <h1>一山一水，都是故乡</h1>
    <p>四面青山环抱，一条碧水穿城，这就是我长大的地方。</p>
  </section>

  <main>
    <section id="gallery">
      <h2>家乡风光图廊</h2>
      <div class="gallery">
        <figure class="spot">
          <img src="img/mountain.svg" alt="青山远景">
          <figcaption>
            <h3>青山远眺</h3>
            <p>清晨薄雾里的连绵青山，是我们进山踏青常走的路。</p>
          </figcaption>
        </figure>
        <figure class="spot">
          <img src="img/lake.svg" alt="镜湖">
          <figcaption>
            <h3>镜湖泛舟</h3>
            <p>城西的镜湖，水面平如明镜，夏天最适合划船。</p>
          </figcaption>
        </figure>
        <figure class="spot">
          <img src="img/town.svg" alt="古镇老街">
          <figcaption>
            <h3>古镇老街</h3>
            <p>青瓦白墙的老街，藏着祖辈传下来的手艺铺子。</p>
          </figcaption>
        </figure>
        <figure class="spot">
          <img src="img/field.svg" alt="金穗田野">
          <figcaption>
            <h3>金穗田野</h3>
            <p>秋收时节，稻浪翻金，空气里都是丰收的味道。</p>
          </figcaption>
        </figure>
        <figure class="spot">
          <img src="img/gallery.svg" alt="江上廊桥">
          <figcaption>
            <h3>江上廊桥</h3>
            <p>横跨碧江的廊桥，是放学后大家最爱聚的地方。</p>
          </figcaption>
        </figure>
        <figure class="spot">
          <img src="img/night.svg" alt="月夜星光">
          <figcaption>
            <h3>月夜星光</h3>
            <p>没有霓虹的夜晚，抬头就能看见满天星辰。</p>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>我以我心爱家乡 · 响应式专题页作品</p>
  </footer>
</body>
</html>
